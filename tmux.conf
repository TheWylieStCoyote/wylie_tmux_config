# ─── Prefix ───────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ─── Core ─────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
set -g focus-events on
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g detach-on-destroy off
setw -g aggressive-resize on
set -g allow-passthrough on   # image previews (yazi, kitty/sixel) inside tmux

# ─── Colors — Monokai Pro (Ristretto) ─────────────────────────────────────────
#   bg      #2c2525   fg      #fff1f3   grey   #948a8b
#   red     #fd6883   green   #adda78   yellow #f9cc6c
#   blue    #85dacc   orange  #f38d70   purple #a8a9eb

# ─── Pane Borders ─────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#948a8b"
set -g pane-active-border-style "fg=#85dacc"
set -g pane-border-lines        single

# ─── Messages ─────────────────────────────────────────────────────────────────
set -g message-style         "fg=#f9cc6c bg=default bold"
set -g message-command-style "fg=#f38d70 bg=default bold"

# ─── Copy / Search Highlight ──────────────────────────────────────────────────
set -g mode-style "fg=#2c2525 bg=#f9cc6c"

# ─── Status Bar ───────────────────────────────────────────────────────────────
set -g status          on
set -g status-position bottom
set -g status-justify  left
set -g status-style    "bg=default fg=#fff1f3"

set -g status-left-length  40
set -g status-right-length 140

set -g status-left \
  "#[fg=#2c2525 bg=#a8a9eb bold] 󰡷 #S #[fg=#a8a9eb bg=default] "

set -g status-right \
  "#[fg=#948a8b]#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /')  "\
"#[fg=#948a8b]│  #[fg=#85dacc]%H:%M  #[fg=#948a8b]│  #[fg=#adda78]%d %b %Y"

# ─── Window Status ────────────────────────────────────────────────────────────
setw -g window-status-format         "#[fg=#948a8b] #I  #W "
setw -g window-status-current-format "#[fg=#f9cc6c bold] #I  #W "
setw -g window-status-separator      ""
setw -g automatic-rename             on
setw -g automatic-rename-format      "#{b:pane_current_path}"

# ─── Key Bindings ─────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "  config reloaded"

# Splits — preserve cwd
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation — prefix+hjkl as fallback; vim-tmux-navigator provides C-hjkl without prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize — repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Restore C-l (clear screen) — vim-tmux-navigator claims C-l
bind C-l send-keys 'C-l'

# Window navigation
bind -r [ previous-window
bind -r ] next-window
bind Tab  last-window

# Session management
bind s choose-tree  -Zs
bind n new-session

# Kill without confirm (capital for session)
bind x kill-pane
bind X kill-window
bind Q confirm-before -p "kill session '#S'? (y/n)" kill-session

# Popup terminal — floating shell at cwd
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "$SHELL"

# Help popup — fuzzy-searchable keybinding reference (built-in list-keys moved to /)
bind ? display-popup -E -w 60% -h 85% "~/.config/tmux/scripts/help.sh"
bind / list-keys

# Tmuxinator — fzf picker to start a named session (shows a message if not installed)
bind M if-shell "command -v tmuxinator >/dev/null" \
  "display-popup -E -w 40% -h 50% \"tmuxinator list -n | tail -n +2 | fzf --prompt='  session: ' | xargs -r tmuxinator start\"" \
  "display '  tmuxinator not installed — gem install tmuxinator'"

# ─── Copy Mode (vi) ───────────────────────────────────────────────────────────
setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-d    send-keys -X halfpage-down
bind -T copy-mode-vi C-u    send-keys -X halfpage-up
bind -T copy-mode-vi H      send-keys -X start-of-line
bind -T copy-mode-vi L      send-keys -X end-of-line
bind -T copy-mode-vi /      send-keys -X search-forward
bind -T copy-mode-vi ?      send-keys -X search-backward
bind -T copy-mode-vi n      send-keys -X search-again
bind -T copy-mode-vi N      send-keys -X search-reverse

# ─── Plugins (tpm) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'Morantron/tmux-fingers'

# resurrect — restore neovim sessions too
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim         'session'

# continuum — auto-save every 15 min, restore on tmux start
set -g @continuum-restore        'on'
set -g @continuum-save-interval  '15'

# tmux-fzf
set -g @tmux-fzf-launch-key 'C-f'

# tmux-fingers — hint mode for paths, URLs, hashes
set -g @fingers-key 'F'

# Initialize tpm — must remain last line
run '~/.config/tmux/plugins/tpm/tpm'
